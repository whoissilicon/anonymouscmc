<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anonymous Chat CMC — Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Caveat:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf7ec; --rule:#c7d0e3; --card:#fdfbf5;
    --ink:#2a2620; --ink-dim:#7a7162; --red:#9c2b22;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex; overflow:hidden;
  }
  .app{ display:flex; width:100%; height:100%; }

  /* ---- Sidebar (group list) ---- */
  .sidebar{
    width:280px; min-width:280px; background:var(--card);
    border-right:1px solid var(--rule);
    display:flex; flex-direction:column;
  }
  .sidebar-head{
    padding:16px; border-bottom:2px solid var(--ink);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand .rx-mark{ font-family:'Playfair Display',serif; font-style:italic; font-weight:600; font-size:22px; color:var(--red); }
  .brand-name{ font-family:'Playfair Display',serif; font-weight:600; font-size:14px; letter-spacing:0.1px; color:var(--ink); }
  .icon-btn{
    background:#fff; border:1px dashed var(--red); color:var(--red);
    width:30px; height:30px; border-radius:6px; font-size:18px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-style:solid; }
  .group-list{ flex:1; overflow-y:auto; padding:8px; }
  .group-item{
    padding:11px 12px; border-radius:4px; cursor:pointer;
    display:flex; flex-direction:column; gap:2px; margin-bottom:2px;
    border:1px solid transparent; border-bottom:1px dashed var(--rule);
  }
  .group-item:hover{ background:#fff; }
  .group-item.active{ background:#fff; border-color:var(--red); }
  .group-item .gname{ font-size:14px; font-weight:500; }
  .group-item .gmeta{ font-family:'Caveat',cursive; font-size:13px; color:var(--ink-dim); }
  .empty-note{ color:var(--ink-dim); font-size:12.5px; padding:14px 12px; line-height:1.5; font-style:italic; }

  /* ---- Chat pane ---- */
  .chat{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-head{
    padding:14px 20px; border-bottom:2px solid var(--ink);
    display:flex; align-items:center; gap:10px; background:var(--card);
  }
  .chat-head .gname{ font-family:'Playfair Display',serif; font-size:17px; font-weight:600; }
  .messages{ flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
  .msg-row{ max-width:72%; }
  .msg-row.mine{ align-self:flex-end; }
  .bubble{
    background:var(--card); border:1px solid var(--rule); border-radius:6px;
    padding:9px 12px; font-size:14px; line-height:1.5; word-break:break-word;
  }
  .msg-row.mine .bubble{ background:#fff; border-color:var(--red); }
  .bubble a{ color:var(--red); text-decoration:underline; }
  .sender{ font-family:'Caveat',cursive; font-size:13px; color:var(--red); margin:0 0 2px 2px; }
  .composer{
    border-top:2px solid var(--ink); padding:12px 16px; background:var(--card);
    display:flex; gap:10px; align-items:flex-end;
  }
  .composer input{
    flex:1; background:#fff; border:1px solid var(--rule);
    border-radius:6px; padding:11px 12px; color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif; font-size:14.5px; outline:none;
  }
  .composer input:focus{ border-color:var(--red); }
  .composer button{
    background:transparent; color:var(--red); border:2px dashed var(--red); border-radius:6px;
    padding:11px 16px; font-weight:600; font-size:13px; letter-spacing:0.4px; text-transform:uppercase; cursor:pointer;
  }
  .placeholder{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim); font-size:14px; font-style:italic; text-align:center; padding:20px;
  }

  /* ---- New-group modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(42,38,32,.35);
    display:none; align-items:center; justify-content:center; z-index:10;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--card); border:1px solid var(--rule); border-top:3px double var(--ink);
    border-radius:2px; width:100%; max-width:320px; padding:22px;
  }
  .modal h2{ font-family:'Playfair Display',serif; font-size:18px; margin:0 0 14px; font-weight:600; }
  .modal input{
    width:100%; background:#fff; border:1px solid var(--rule);
    border-radius:6px; padding:10px 12px; color:var(--ink); font-size:14px;
    margin-bottom:14px; outline:none;
  }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1; padding:10px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn-primary{ background:var(--red); color:#fdfbf5; border:none; }
  .btn-secondary{ background:transparent; border:1px solid var(--rule); color:var(--ink-dim); }

  /* ---- Mobile: stack sidebar / chat, toggle by JS ---- */
  @media (max-width:720px){
    .sidebar{ width:100%; min-width:0; display:flex; }
    .chat{ display:none; }
    body.chat-open .sidebar{ display:none; }
    body.chat-open .chat{ display:flex; }
    .back-btn{ display:inline-flex !important; }
  }
  .back-btn{ display:none; background:none; border:none; color:var(--red); font-size:20px; cursor:pointer; padding:0 4px 0 0; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="rx-mark">℞</span>
        <span class="brand-name">Anonymous Chat CMC</span>
      </div>
      <button class="icon-btn" id="newGroupBtn" title="নতুন গ্রুপ">+</button>
    </div>
    <div class="group-list" id="groupList">
      <div class="empty-note">এখনো কোনো ওয়ার্ড/গ্রুপ খোলা হয়নি — উপরের + বাটনে চাপ দিয়ে একটা রেজিস্টার করুন।</div>
    </div>
  </div>

  <div class="chat" id="chatPane">
    <div class="placeholder" id="chatPlaceholder">বাম পাশ থেকে একটা গ্রুপ বাছুন, অথবা নতুন একটা বানান।</div>
    <template id="chatTemplate">
      <div class="chat-head">
        <button class="back-btn" id="backBtn">←</button>
        <span class="gname" id="chatGroupName"></span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="msgInput" type="text" placeholder="মেসেজ লিখুন বা লিংক পেস্ট করুন…" autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </template>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>নতুন ওয়ার্ড রেজিস্টার করুন</h2>
    <input id="groupNameInput" type="text" placeholder="নাম, যেমন: Batch 2024 General">
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelGroupBtn">বাতিল</button>
      <button class="btn-primary" id="createGroupBtn">তৈরি করুন</button>
    </div>
  </div>
</div>

<!--
  ===================================================================
  FIREBASE CONNECTION — same config as login.html, paste it below too.
  This page requires the user to already be signed in (from login.html).
  Firestore layout used here:
    groups/{groupId}            { name, createdBy, createdAt }
    groups/{groupId}/messages/{messageId}  { text, senderRoll, createdAt }
  Firestore security rules should restrict reads/writes to signed-in users —
  ask Claude for ready-made rules once your project is connected.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy,
    onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Paste your Firebase project config here (same as login.html):
  const firebaseConfig = {
    // apiKey: "...",
    // authDomain: "...",
    // projectId: "...",
    // appId: "..."
  };

  const isConfigured = Object.keys(firebaseConfig).length > 0;
  const groupListEl = document.getElementById("groupList");
  const chatPane = document.getElementById("chatPane");
  const chatPlaceholder = document.getElementById("chatPlaceholder");
  const chatTemplate = document.getElementById("chatTemplate");
  const overlay = document.getElementById("overlay");

  let db = null, auth = null, currentUser = null, currentRoll = "anon";
  let activeGroupId = null, unsubMessages = null;

  document.getElementById("newGroupBtn").addEventListener("click", () => overlay.classList.add("show"));
  document.getElementById("cancelGroupBtn").addEventListener("click", () => overlay.classList.remove("show"));

  function rollFromEmail(email){
    return (email || "").split("@")[0].replace(/^0+/, "") || "anon";
  }

  function linkify(text){
    const escaped = text.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
    return escaped.replace(/(https?:\/\/[^\s]+)/g, url =>
      `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
  }

  function renderGroupList(groups){
    if (groups.length === 0){
      groupListEl.innerHTML = '<div class="empty-note">এখনো কোনো ওয়ার্ড/গ্রুপ খোলা হয়নি — উপরের + বাটনে চাপ দিয়ে একটা রেজিস্টার করুন।</div>';
      return;
    }
    groupListEl.innerHTML = "";
    groups.forEach(g => {
      const div = document.createElement("div");
      div.className = "group-item" + (g.id === activeGroupId ? " active" : "");
      div.innerHTML = `<span class="gname"></span><span class="gmeta">WARD · ACTIVE</span>`;
      div.querySelector(".gname").textContent = g.name;
      div.addEventListener("click", () => openGroup(g.id, g.name));
      groupListEl.appendChild(div);
    });
  }

  function openGroup(id, name){
    activeGroupId = id;
    document.body.classList.add("chat-open");
    chatPlaceholder.style.display = "none";
    chatPane.innerHTML = "";
    chatPane.appendChild(chatTemplate.content.cloneNode(true));
    document.getElementById("chatGroupName").textContent = name;
    document.getElementById("backBtn").addEventListener("click", () => {
      document.body.classList.remove("chat-open");
    });

    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    if (unsubMessages) unsubMessages();
    const q = query(collection(db, "groups", id, "messages"), orderBy("createdAt", "asc"));
    unsubMessages = onSnapshot(q, snap => {
      messagesEl.innerHTML = "";
      snap.forEach(docSnap => {
        const m = docSnap.data();
        const mine = m.senderRoll === currentRoll;
        const row = document.createElement("div");
        row.className = "msg-row" + (mine ? " mine" : "");
        row.innerHTML = `${mine ? "" : `<div class="sender">${m.senderRoll}</div>`}<div class="bubble">${linkify(m.text || "")}</div>`;
        messagesEl.appendChild(row);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    async function send(){
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      await addDoc(collection(db, "groups", id, "messages"), {
        text, senderRoll: currentRoll, createdAt: serverTimestamp()
      });
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  }

  document.getElementById("createGroupBtn").addEventListener("click", async () => {
    const name = document.getElementById("groupNameInput").value.trim();
    if (!name || !db) return;
    await addDoc(collection(db, "groups"), {
      name, createdBy: currentRoll, createdAt: serverTimestamp()
    });
    document.getElementById("groupNameInput").value = "";
    overlay.classList.remove("show");
  });

  if (!isConfigured){
    groupListEl.innerHTML = '<div class="empty-note">Firebase এখনো কানেক্ট করা হয়নি — এই ফাইলে firebaseConfig বসান, তারপর ওয়ার্ড/গ্রুপ ও চ্যাট চালু হবে।</div>';
  } else {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user){
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      currentRoll = rollFromEmail(user.email);
      const q = query(collection(db, "groups"), orderBy("createdAt", "desc"));
      onSnapshot(q, snap => {
        const groups = [];
        snap.forEach(d => groups.push({ id: d.id, ...d.data() }));
        renderGroupList(groups);
      });
    });
  }
</script>
</body>
</html>
